name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  course-pack-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm course-pack validate courses/contract-smoke
      - run: pnpm course-pack build courses/contract-smoke --out artifacts/contract-smoke-0.0.1.ocpack
      - run: pnpm course-pack inspect artifacts/contract-smoke-0.0.1.ocpack
