name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  course-pack-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: |
          if ! pnpm install --frozen-lockfile; then
            # Expose the exact failing hunk instead of pnpm's package-level error.
            runtime=$(find node_modules/.pnpm -type d -path '*/node_modules/octos-lesson-language' -print -quit)
            if [ -n "$runtime" ]; then
              patch --dry-run --batch -p1 -d "$runtime" -i "$PWD/patches/octos-lesson-language@0.1.0-rc.1.patch" || true
            fi
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm course-pack validate courses/contract-smoke
      - run: pnpm course-pack build courses/contract-smoke --out artifacts/contract-smoke-0.0.1.ocpack
      - run: pnpm course-pack inspect artifacts/contract-smoke-0.0.1.ocpack
