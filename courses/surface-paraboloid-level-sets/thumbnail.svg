<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f2e8"/>
  <g transform="translate(120 80)">
    <rect width="500" height="390" rx="28" fill="#fffdf8" stroke="#d9d2c5" stroke-width="4"/>
    <!-- 3D Axes -->
    <path d="M250 240 L110 330 M250 240 L390 330 M250 240 V60" stroke="#8c9892" stroke-width="4" stroke-dasharray="4 4"/>
    <path d="M250 240 L80 350" stroke="#48534e" stroke-width="5"/>
    <path d="M250 240 L420 350" stroke="#48534e" stroke-width="5"/>
    <path d="M250 240 V50" stroke="#48534e" stroke-width="5"/>
    <text x="70" y="370" fill="#48534e" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">x</text>
    <text x="425" y="370" fill="#48534e" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">y</text>
    <text x="258" y="45" fill="#48534e" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">z</text>
    <!-- Paraboloid Surface Curves -->
    <path d="M120 120 Q250 280 380 120" fill="none" stroke="#167d78" stroke-width="7"/>
    <path d="M160 160 Q250 280 340 160" fill="none" stroke="#1ba8a1" stroke-width="5"/>
    <path d="M200 200 Q250 280 300 200" fill="none" stroke="#28c4bc" stroke-width="4"/>
    <!-- Section Slicing Plane & Intersection Circle -->
    <polygon points="100,160 360,130 400,200 140,230" fill="#e18b56" fill-opacity="0.25" stroke="#e18b56" stroke-width="3"/>
    <ellipse cx="250" cy="180" rx="90" ry="28" fill="none" stroke="#d96a20" stroke-width="6"/>
    <text x="375" y="150" fill="#d96a20" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">z = h</text>
  </g>
  <text x="700" y="190" fill="#183b3a" font-family="system-ui, sans-serif" font-size="64" font-weight="700">z = f(x, y)</text>
  <text x="700" y="270" fill="#0d6f6b" font-family="system-ui, sans-serif" font-size="32">multivariable · 3D surfaces · cross sections</text>
  <text x="80" y="570" fill="#202925" font-family="system-ui, sans-serif" font-size="58" font-weight="700">旋转抛物面的截面与降维分析法</text>
  <text x="84" y="620" fill="#65716b" font-family="system-ui, sans-serif" font-size="25">Octos Learn · College Calculus Collection</text>
</svg>
